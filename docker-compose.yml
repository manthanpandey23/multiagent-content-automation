services:

  postgres:
    image: postgres:16
    container_name: social-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: social_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: social-agent-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data: